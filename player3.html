<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Người Chơi 3 - Chuông Bấm</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Quicksand:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #239d67;
            font-family: 'Nunito', 'Quicksand', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        /* Fullscreen Buzzer Canvas */
        #buzzerBtn {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at 50% 48%, #2fa872 0%, #228f5c 70%, #1a754a 100%);
            border: none;
            outline: none;
            cursor: pointer;
            color: #ffffff;
            transition: background 0.3s ease, transform 0.08s ease, filter 0.2s ease;
            -webkit-tap-highlight-color: transparent;
            z-index: 10;
        }

        #buzzerBtn:active:not(.disabled):not(.success) {
            transform: scale(0.985);
            background: radial-gradient(circle at 50% 48%, #36bd81 0%, #1e8755 100%);
            filter: brightness(1.08);
        }

        /* Main Rounded Display Text: "trả lời" */
        .answer-text {
            font-size: min(23vw, 28vh, 210px);
            font-weight: 800;
            color: #f1fcf6;
            letter-spacing: -0.5px;
            line-height: 1;
            text-align: center;
            text-shadow: 0 4px 18px rgba(0, 0, 0, 0.12);
            font-family: 'Nunito', 'Quicksand', sans-serif;
            pointer-events: none;
            transition: all 0.2s ease;
        }

        /* Subtle floating top header overlay */
        .top-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 22px;
            z-index: 30;
            pointer-events: none;
        }

        .player-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .player-tag .dot {
            width: 9px;
            height: 9px;
            background: #2ecc71;
            border-radius: 50%;
            box-shadow: 0 0 8px #2ecc71;
            animation: pulse-dot 1.5s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.7; }
        }

        .action-btns {
            pointer-events: auto;
            display: flex;
            gap: 8px;
        }

        .header-btn {
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            font-size: 13px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .header-btn:hover {
            background: rgba(0, 0, 0, 0.55);
            border-color: rgba(255, 255, 255, 0.4);
        }

        /* Subtle Bottom Instruction Hint */
        .bottom-hint {
            position: fixed;
            bottom: 18px;
            left: 0;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.85);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.3px;
            z-index: 30;
            pointer-events: none;
            text-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        /* SUCCESS / WON BUZZ STATE */
        #buzzerBtn.success {
            background: radial-gradient(circle at 50% 48%, #22c55e 0%, #15803d 80%, #14532d 100%);
            animation: pulse-success 1.2s infinite alternate;
        }

        #buzzerBtn.success .answer-text {
            color: #ffffff;
            transform: scale(1.04);
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.8), 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        @keyframes pulse-success {
            0% { box-shadow: inset 0 0 60px rgba(255, 255, 255, 0.3); }
            100% { box-shadow: inset 0 0 120px rgba(255, 255, 255, 0.6); }
        }

        /* LOCKED / ANOTHER PLAYER BUZZED STATE */
        #buzzerBtn.disabled {
            background: radial-gradient(circle at 50% 48%, #2c1719 0%, #1a0f10 80%, #100809 100%);
            cursor: not-allowed;
        }

        #buzzerBtn.disabled .answer-text {
            color: rgba(255, 255, 255, 0.25);
            text-shadow: none;
            filter: grayscale(1);
        }

        /* Success/Lock Banner overlay on the button */
        .status-pill {
            margin-top: 15px;
            font-size: min(4vw, 20px);
            font-weight: 800;
            padding: 8px 24px;
            border-radius: 30px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.25);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            pointer-events: none;
        }

        #buzzerBtn.success .status-pill {
            background: #ffffff;
            color: #15803d;
            border-color: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
        }

        #buzzerBtn.disabled .status-pill {
            background: #c0392b;
            color: #ffffff;
            border-color: #ff5252;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body>

    <!-- Header Overlay -->
    <div class="top-overlay">
        <div class="player-tag">
            <span class="dot"></span>
            <span>NGƯỜI CHƠI 3</span>
        </div>
        <div class="action-btns">
            <button class="header-btn" onclick="toggleFullScreen()" title="Toàn màn hình">
                ⛶ Toàn màn hình
            </button>
        </div>
    </div>

    <!-- Full Screen Interactive Buzzer Area -->
    <button id="buzzerBtn" onclick="buzz()" aria-label="Bấm chuông trả lời">
        <div class="answer-text">trả lời</div>
        <div id="statusPill" class="status-pill" style="display: none;">SẴN SÀNG</div>
    </button>

    <!-- Bottom Hint -->
    <div id="bottomHint" class="bottom-hint">
        Chạm màn hình hoặc phím Cách [Space] để chuông
    </div>

    <script>
        const PLAYER_NUM = 3;
        const SUPABASE_URL = "https://tukabyhjmcyptuwmwedp.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR1a2FieWhqbWN5cHR1d213ZWRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0NDk3NDksImV4cCI6MjA5NjAyNTc0OX0.gNWdvZ_hRdon_w_KL3C3eXFFiV_EoA4eLgikcYb6dpQ";

        let supabaseClient = null;
        let channel = null;
        let localBC = null;

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen().catch(() => {});
                }
            }
        }

        // 1. Initialize Supabase Realtime
        try {
            if (typeof window.supabase !== "undefined" && window.supabase.createClient) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                channel = supabaseClient.channel('crossword_broadcast_room', {
                    config: { broadcast: { ack: false, self: true } }
                });
                
                channel.on('broadcast', { event: 'player-buzz' }, ({ payload }) => {
                    if (payload && payload.playerNum) {
                        handleIncomingBuzz(payload.playerNum);
                    }
                });
                channel.on('broadcast', { event: 'control-to-display' }, ({ payload }) => {
                    if (payload) {
                        handleIncomingControl(payload);
                    }
                });
                
                channel.subscribe((status) => {
                    console.log("Supabase connection status:", status);
                });
            }
        } catch (e) {
            console.error("Supabase failed to initialize:", e);
        }

        // 2. Initialize Server-Sent Events (SSE) for instant multi-device sync
        try {
            if (typeof EventSource !== "undefined") {
                const sse = new EventSource('/api/events');
                sse.onmessage = (e) => {
                    try {
                        const msg = JSON.parse(e.data);
                        if (!msg) return;
                        if (msg.event === 'player-buzz' && msg.payload && msg.payload.playerNum) {
                            handleIncomingBuzz(msg.payload.playerNum);
                        } else if (msg.event === 'control-to-display' && msg.payload) {
                            handleIncomingControl(msg.payload);
                        }
                    } catch(err){}
                };
            }
        } catch(e) {}

        // 3. Local BroadcastChannel
        try {
            localBC = new BroadcastChannel('crossword_broadcast_room');
            localBC.onmessage = (event) => {
                if (event.data) {
                    if (event.data.event === 'player-buzz' && event.data.payload) {
                        handleIncomingBuzz(event.data.payload.playerNum);
                    }
                    if (event.data.event === 'control-to-display' && event.data.payload) {
                        handleIncomingControl(event.data.payload);
                    }
                }
            };
        } catch (e) {}

        function handleIncomingBuzz(pNum) {
            localStorage.setItem('tossup-buzzer-winner', pNum);
            syncBuzzerState();
        }

        function handleIncomingControl(payload) {
            const type = payload.type;
            if (type === 'START_TOSSUP' || type === 'PLAY_TOSSUP' || type === 'LOAD_QUIZ' || type === 'RESET_BOARD' || type === 'SHOW_MANUAL_TEXT') {
                localStorage.removeItem('tossup-buzzer-winner');
                syncBuzzerState();
            }
        }

        function playLocalDing() {
            try {
                const snd = new Audio("ding.mp3");
                snd.play().catch(err => console.log(err));
            } catch(e) {}
        }

        function buzz() {
            const btn = document.getElementById("buzzerBtn");
            if (btn.classList.contains("disabled") || btn.classList.contains("success")) {
                return;
            }

            // Check if someone else already won
            const winner = localStorage.getItem('tossup-buzzer-winner');
            if (winner) {
                syncBuzzerState();
                return;
            }

            // Write to localStorage
            localStorage.setItem('tossup-buzzer-winner', PLAYER_NUM);

            if (navigator.vibrate) {
                navigator.vibrate([180]);
            }

            playLocalDing();
            setBuzzerSuccess();

            const payload = { playerNum: PLAYER_NUM, ts: Date.now() };
            const msgObj = { event: 'player-buzz', payload: payload, ts: Date.now() };

            // 1. Post to Server API
            try {
                fetch('/api/broadcast', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(msgObj)
                }).catch(() => {});
            } catch(e) {}

            // 2. Send via Supabase Realtime
            if (channel) {
                try {
                    channel.send({ type: 'broadcast', event: 'player-buzz', payload: payload });
                } catch(e){}
            }

            // 3. Local BroadcastChannel
            if (localBC) {
                try {
                    localBC.postMessage(msgObj);
                } catch(e){}
            }

            // 4. LocalStorage
            try {
                localStorage.setItem('player-buzz-msg', JSON.stringify(msgObj));
                localStorage.removeItem('player-buzz-msg');
            } catch(e){}

            // 5. Post message
            try {
                window.postMessage(msgObj, "*");
                if (window.opener) window.opener.postMessage(msgObj, "*");
                if (window.parent && window.parent !== window) window.parent.postMessage(msgObj, "*");
            } catch(e){}
        }

        function setBuzzerSuccess() {
            const btn = document.getElementById("buzzerBtn");
            const pill = document.getElementById("statusPill");
            const hint = document.getElementById("bottomHint");

            btn.className = "success";
            pill.style.display = "inline-flex";
            pill.textContent = "🔔 BẠN ĐÃ DÀNH QUYỀN TRẢ LỜI!";
            hint.textContent = "Đang trong lượt trả lời của bạn";
        }

        function setBuzzerLocked(winnerNum) {
            const btn = document.getElementById("buzzerBtn");
            const pill = document.getElementById("statusPill");
            const hint = document.getElementById("bottomHint");

            btn.className = "disabled";
            pill.style.display = "inline-flex";
            pill.textContent = `🔒 Người chơi ${winnerNum} đã bấm trước!`;
            hint.textContent = "Chuông đã khóa cho lượt này";
        }

        function resetBuzzer() {
            const btn = document.getElementById("buzzerBtn");
            const pill = document.getElementById("statusPill");
            const hint = document.getElementById("bottomHint");

            btn.className = "";
            pill.style.display = "none";
            hint.textContent = "Chạm màn hình hoặc phím Cách [Space] để chuông";
        }

        function syncBuzzerState() {
            const winner = localStorage.getItem('tossup-buzzer-winner');
            if (winner) {
                if (parseInt(winner) === PLAYER_NUM) {
                    setBuzzerSuccess();
                } else {
                    setBuzzerLocked(winner);
                }
            } else {
                resetBuzzer();
            }
        }

        // Keyboard Shortcut: Space or Enter to Buzz
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.key === ' ' || e.key === 'Enter') {
                e.preventDefault();
                buzz();
            }
            if (e.key === 'f' || e.key === 'F') {
                toggleFullScreen();
            }
        });

        window.addEventListener('storage', (e) => {
            if (e.key === 'tossup-buzzer-winner') {
                syncBuzzerState();
            }
            if (e.key === 'player-buzz-msg' && e.newValue) {
                try {
                    const data = JSON.parse(e.newValue);
                    if (data && data.payload) {
                        handleIncomingBuzz(data.payload.playerNum);
                    }
                } catch(err){}
            }
            if (e.key === 'control-to-display-msg' && e.newValue) {
                try {
                    const data = JSON.parse(e.newValue);
                    if (data && data.payload) {
                        handleIncomingControl(data.payload);
                    }
                } catch(err){}
            }
        });

        window.addEventListener('message', (event) => {
            if (event.data) {
                if (event.data.event === 'player-buzz' && event.data.payload) {
                    handleIncomingBuzz(event.data.payload.playerNum);
                }
                if (event.data.event === 'control-to-display' && event.data.payload) {
                    handleIncomingControl(event.data.payload);
                }
            }
        });

        // Initialize state on load
        syncBuzzerState();
    </script>
</body>
</html>
