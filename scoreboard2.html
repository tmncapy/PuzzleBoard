<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Điểm Đội Vàng - Game Show</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Tải font SVN-Gilroy cho scoreboard */
        @font-face {
            font-family: 'SVN-Gilroy';
            src: url('SVN-Gilroy Bold.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'SVN-Gilroy';
            src: url('SVN-Gilroy Bold.otf') format('opentype');
            font-weight: bold;
            font-style: normal;
        }

        @font-face {
            font-family: 'SVN-Gilroy Bold';
            src: url('SVN-Gilroy Bold.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'SVN-Gilroy Bold';
            src: url('SVN-Gilroy Bold.otf') format('opentype');
            font-weight: bold;
            font-style: normal;
        }
        
        body {
            font-family: 'SVN-Gilroy', 'SVN-Gilroy Bold', sans-serif;
            background-color: #f2a900; /* Vibrant solid yellow */
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .number-text {
            font-family: 'SVN-Gilroy', 'SVN-Gilroy Bold', sans-serif;
            /* Creating the bold white text with thin black outline/shadow effect matching the image */
            color: #ffffff;
            font-size: min(22vw, 42vh);
            font-weight: 900;
            line-height: 1;
            letter-spacing: -0.02em;
            text-shadow: 
                -2px -2px 0 #000,  
                 2px -2px 0 #000,
                -2px  2px 0 #000,
                 2px  2px 0 #000,
                 0px -2px 0 #000,
                 0px  2px 0 #000,
                -2px  0px 0 #000,
                 2px  0px 0 #000;
            text-align: center;
            white-space: nowrap;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .score-bump {
            transform: scale(1.08);
        }

        /* 2 mũi tên >< chớp từ từ ở 2 cạnh bên scoreboard khi bấm chuông */
        .buzzer-arrow {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            color: #ffffff;
            font-size: min(18vw, 32vh);
            font-weight: 900;
            line-height: 1;
            letter-spacing: -0.02em;
            text-shadow: 
                -3px -3px 0 #000,  
                 3px -3px 0 #000,
                -3px  3px 0 #000,
                 3px  3px 0 #000,
                 0px -3px 0 #000,
                 0px  3px 0 #000,
                -3px  0px 0 #000,
                 3px  0px 0 #000;
            opacity: 0;
            pointer-events: none;
            user-select: none;
            z-index: 50;
            transition: opacity 0.4s ease;
        }

        .buzzer-arrow.left {
            left: clamp(1rem, 3.5vw, 4rem);
        }

        .buzzer-arrow.right {
            right: clamp(1rem, 3.5vw, 4rem);
        }

        .buzzer-arrow.active {
            opacity: 1;
            animation: slowBlink 1.2s ease-in-out infinite;
        }

        @keyframes slowBlink {
            0%, 100% {
                opacity: 0.15;
                transform: translateY(-50%) scale(0.92);
                filter: drop-shadow(0 0 0 rgba(255, 255, 255, 0));
            }
            50% {
                opacity: 1;
                transform: translateY(-50%) scale(1.12);
                filter: drop-shadow(0 0 25px rgba(255, 255, 255, 0.95)) drop-shadow(0 0 45px rgba(255, 255, 255, 0.7));
            }
        }

        .team-title {
            position: absolute;
            top: 5vh;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.95);
            font-weight: 900;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-size: clamp(1rem, 2.5vw, 2.2rem);
            text-shadow: 
                -2px -2px 0 #000,  
                 2px -2px 0 #000,
                -2px  2px 0 #000,
                 2px  2px 0 #000;
            pointer-events: none;
        }
    </style>
</head>
<body class="w-screen h-screen flex items-center justify-center relative overflow-hidden">

    <!-- 2 MŨI TÊN >< CHỚP TỪ TỪ Ở 2 CẠNH BÊN SCOREBOARD -->
    <div id="buzzerArrowLeft" class="buzzer-arrow left" aria-hidden="true">&gt;</div>
    <div id="buzzerArrowRight" class="buzzer-arrow right" aria-hidden="true">&lt;</div>

    <main class="flex flex-col items-center justify-center w-full h-full select-none relative">
        <div id="teamName" class="team-title">ĐỘI VÀNG</div>
        <h1 id="scoreValue" class="number-text">0</h1>
    </main>

    <script>
        // Cấu hình Scoreboard 2: Đội Vàng (Player 2)
        const MY_PLAYER_NUM = 2;
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('roomid') || 'default_room';

        const scoreValueEl = document.getElementById('scoreValue');
        const teamNameEl = document.getElementById('teamName');
        const buzzerArrowLeftEl = document.getElementById('buzzerArrowLeft');
        const buzzerArrowRightEl = document.getElementById('buzzerArrowRight');

        let currentScore = 0;
        let targetScore = 0;
        let animationFrameId = null;
        let buzzerResetTimer = null;

        // Định dạng điểm số theo kiểu Việt Nam (dấu chấm ngăn cách hàng nghìn, ví dụ: 10.000)
        function formatScore(val) {
            if (val === undefined || val === null || isNaN(val)) return "0";
            return Number(val).toLocaleString('vi-VN');
        }

        // Tự động điều chỉnh kích cỡ font chữ khi số điểm quá dài
        function adjustFontSize(text) {
            if (!scoreValueEl) return;
            const len = text.length;
            if (len <= 4) {
                scoreValueEl.style.fontSize = 'min(24vw, 44vh)';
            } else if (len <= 6) {
                scoreValueEl.style.fontSize = 'min(22vw, 42vh)';
            } else if (len <= 8) {
                scoreValueEl.style.fontSize = 'min(17vw, 34vh)';
            } else {
                scoreValueEl.style.fontSize = 'min(13vw, 26vh)';
            }
        }

        // Cập nhật điểm mượt mà
        function setScore(score, animate = true) {
            const numericScore = parseInt(score);
            if (isNaN(numericScore)) return;

            targetScore = numericScore;

            if (!animate) {
                currentScore = targetScore;
                const formatted = formatScore(currentScore);
                scoreValueEl.textContent = formatted;
                adjustFontSize(formatted);
                return;
            }

            const startScore = currentScore;
            const startTime = performance.now();
            const duration = 400; // 400ms count up

            scoreValueEl.classList.add('score-bump');
            setTimeout(() => {
                scoreValueEl.classList.remove('score-bump');
            }, 250);

            if (animationFrameId) cancelAnimationFrame(animationFrameId);

            function updateCounter(now) {
                const elapsed = now - startTime;
                const progress = Math.min(1, elapsed / duration);
                const ease = 1 - Math.pow(1 - progress, 3);
                currentScore = Math.round(startScore + (targetScore - startScore) * ease);
                const formatted = formatScore(currentScore);
                scoreValueEl.textContent = formatted;
                adjustFontSize(formatted);

                if (progress < 1) {
                    animationFrameId = requestAnimationFrame(updateCounter);
                } else {
                    currentScore = targetScore;
                    const finalFormatted = formatScore(targetScore);
                    scoreValueEl.textContent = finalFormatted;
                    adjustFontSize(finalFormatted);
                }
            }

            animationFrameId = requestAnimationFrame(updateCounter);
        }

        // Cập nhật tên đội
        function setTeamName(name) {
            if (name && typeof name === 'string' && name.trim()) {
                teamNameEl.textContent = name.trim().toUpperCase();
            }
        }

        // Kích hoạt hiệu ứng 2 mũi tên >< chớp từ từ ở 2 cạnh bên khi bấm chuông
        function triggerBuzzerAlert() {
            if (buzzerArrowLeftEl) buzzerArrowLeftEl.classList.add('active');
            if (buzzerArrowRightEl) buzzerArrowRightEl.classList.add('active');

            try {
                const audio = new Audio("ding.wav");
                audio.play().catch(() => {
                    const fallback = new Audio("ding.mp3");
                    fallback.play().catch(() => {});
                });
            } catch(e) {}

            if (buzzerResetTimer) clearTimeout(buzzerResetTimer);
            buzzerResetTimer = setTimeout(() => {
                clearBuzzerAlert();
            }, 8000);
        }

        function clearBuzzerAlert() {
            if (buzzerResetTimer) clearTimeout(buzzerResetTimer);
            buzzerResetTimer = null;
            if (buzzerArrowLeftEl) buzzerArrowLeftEl.classList.remove('active');
            if (buzzerArrowRightEl) buzzerArrowRightEl.classList.remove('active');
        }

        function handleBuzzerEvent(playerNum) {
            const num = parseInt(playerNum);
            const allowAllBuzz = urlParams.get('allbuzz') === '1' || urlParams.get('buzz') === 'all';
            if (allowAllBuzz || !playerNum || isNaN(num) || num === MY_PLAYER_NUM || num === 0) {
                triggerBuzzerAlert();
            }
        }

        // Phím tắt tiện lợi:
        // B hoặc Space: Test bấm chuông (hiện 2 mũi tên >< chớp từ từ)
        // Escape hoặc C: Tắt chuông
        // F hoặc double-click: Toàn màn hình (Fullscreen)
        window.addEventListener('keydown', (e) => {
            if (e.key === 'b' || e.key === 'B' || e.code === 'Space') {
                if (e.target.tagName !== 'INPUT') {
                    e.preventDefault();
                    triggerBuzzerAlert();
                }
            } else if (e.key === 'Escape' || e.key === 'c' || e.key === 'C') {
                clearBuzzerAlert();
            } else if (e.key === 'f' || e.key === 'F') {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                } else {
                    document.exitFullscreen().catch(() => {});
                }
            }
        });

        document.body.addEventListener('dblclick', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        });

        // Xử lý gói tin đồng bộ từ Controller
        function handleCommand(msg) {
            if (!msg) return;
            const type = msg.type || msg.action;
            const data = msg.data || msg.payload?.data;

            // 1. Cập nhật bảng điểm
            if (type === 'UPDATE_SCOREBOARD' || type === 'UPDATE_SCORE') {
                const scoreData = data || msg.payload;
                if (scoreData) {
                    if (scoreData.p2) {
                        if (scoreData.p2.name !== undefined) setTeamName(scoreData.p2.name);
                        if (scoreData.p2.score !== undefined) setScore(scoreData.p2.score);
                    } else if (scoreData.player2 !== undefined) {
                        setScore(scoreData.player2);
                    }
                }
            }

            // 2. Tín hiệu chuông bấm
            if (msg.event === 'player-buzz' || type === 'PLAYER_BUZZ_WIN' || type === 'PLAYER_BUZZ' || type === 'BELL' || type === 'BUZZER') {
                const pNum = msg.payload?.playerNum || msg.data?.playerNum || data?.playerNum || msg.playerNum;
                handleBuzzerEvent(pNum);
            }

            // 3. Khóa/mở hoặc reset chuông
            if (type === 'SET_BUZZER_STATE' || type === 'RESET_BUZZ' || type === 'CLEAR_BUZZER' || type === 'START_TOSSUP' || type === 'LOAD_QUIZ' || type === 'UPDATE_CTRL_ACTIVE') {
                if (type === 'RESET_BUZZ' || type === 'CLEAR_BUZZER' || type === 'LOAD_QUIZ' || type === 'UPDATE_CTRL_ACTIVE' || (data && data.state === 'OPEN')) {
                    clearBuzzerAlert();
                }
            }
        }

        // --- 1. LOCAL STORAGE SYNC ---
        function loadInitialStateFromStorage() {
            try {
                let raw = localStorage.getItem('control-to-display-msg_' + roomId) || localStorage.getItem('control-to-display-msg');
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (parsed && (parsed.payload || parsed.data)) {
                        handleCommand(parsed.payload || parsed);
                    }
                }
            } catch(e) {}
        }
        loadInitialStateFromStorage();

        window.addEventListener('storage', (e) => {
            if ((e.key === 'control-to-display-msg' || e.key === 'control-to-display-msg_' + roomId) && e.newValue) {
                try {
                    const parsed = JSON.parse(e.newValue);
                    handleCommand(parsed.payload || parsed);
                } catch(err) {}
            }
            if ((e.key === 'player-buzz-msg' || e.key === 'player-buzz-msg_' + roomId) && e.newValue) {
                try {
                    const parsed = JSON.parse(e.newValue);
                    const pNum = parsed?.payload?.playerNum || parsed?.playerNum;
                    handleBuzzerEvent(pNum);
                } catch(err) {}
            }
        });

        // Polling localStorage mỗi 100ms phòng trường hợp event listener bị lỡ
        let lastMsgTs = 0;
        setInterval(() => {
            try {
                const raw = localStorage.getItem('control-to-display-msg_' + roomId) || localStorage.getItem('control-to-display-msg');
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (parsed && parsed.ts && parsed.ts > lastMsgTs) {
                        lastMsgTs = parsed.ts;
                        handleCommand(parsed.payload || parsed);
                    }
                }
            } catch(e) {}
        }, 100);

        // --- 2. BROADCAST CHANNEL SYNC ---
        try {
            if (typeof BroadcastChannel !== 'undefined') {
                const bcRoom = new BroadcastChannel('broadcast_channel_' + roomId);
                bcRoom.onmessage = (e) => {
                    if (!e.data) return;
                    if (e.data.event === 'player-buzz') {
                        handleBuzzerEvent(e.data.payload?.playerNum);
                    } else {
                        handleCommand(e.data.payload || e.data);
                    }
                };

                const bcCrossword = new BroadcastChannel('crossword_broadcast_room');
                bcCrossword.onmessage = (e) => {
                    if (!e.data) return;
                    if (e.data.event === 'player-buzz') {
                        handleBuzzerEvent(e.data.payload?.playerNum);
                    } else {
                        handleCommand(e.data.payload || e.data);
                    }
                };

                const bcGame = new BroadcastChannel('game_broadcast_channel');
                bcGame.onmessage = (e) => {
                    if (!e.data) return;
                    if (e.data.event === 'player-buzz') {
                        handleBuzzerEvent(e.data.payload?.playerNum);
                    } else {
                        handleCommand(e.data.payload || e.data);
                    }
                };
            }
        } catch(e) {}

        // --- 3. SERVER SENT EVENTS (SSE) QUA API CHO ĐA THIẾT BỊ ---
        function initSSE() {
            if (typeof EventSource === 'undefined') return;
            try {
                const sseUrl = `/api/events?roomid=${encodeURIComponent(roomId)}`;
                const es = new EventSource(sseUrl);
                es.onmessage = (e) => {
                    try {
                        const msg = JSON.parse(e.data);
                        if (!msg) return;
                        if (msg.event === 'control-to-display' && msg.payload) {
                            handleCommand(msg.payload);
                        } else if (msg.event === 'player-buzz' && msg.payload) {
                            handleBuzzerEvent(msg.payload.playerNum);
                        }
                    } catch(err) {}
                };
                es.onerror = () => {
                    es.close();
                    setTimeout(initSSE, 3000);
                };
            } catch(e) {}
        }
        initSSE();

        // --- 4. SUPABASE REALTIME SYNC ---
        try {
            const SUPABASE_URL = "https://tukabyhjmcyptuwmwedp.supabase.co";
            const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR1a2FieWhqbWN5cHR1d213ZWRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0NDk3NDksImV4cCI6MjA5NjAyNTc0OX0.gNWdvZ_hRdon_w_KL3C3eXFFiV_EoA4eLgikcYb6dpQ";
            if (typeof supabase !== 'undefined' && supabase.createClient) {
                const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                const sbChannel = client.channel('crossword_broadcast_room', {
                    config: { broadcast: { ack: false, self: true } }
                });
                sbChannel.on('broadcast', { event: 'control-to-display' }, ({ payload }) => {
                    if (payload) handleCommand(payload);
                });
                sbChannel.on('broadcast', { event: 'player-buzz' }, ({ payload }) => {
                    if (payload) handleBuzzerEvent(payload.playerNum);
                });
                sbChannel.subscribe();
            }
        } catch(e) {}
    </script>
</body>
</html>
