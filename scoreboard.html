<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Điểm Game Show - 3 Đội (OBS Ready)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="sync-bridge.js"></script>
    <style>
        @font-face {
            font-family: 'SVN-Gilroy';
            src: url('SVN-Gilroy Bold.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'SVN-Gilroy Bold';
            src: url('SVN-Gilroy Bold.otf') format('opentype');
            font-weight: bold;
            font-style: normal;
        }

        :root, html {
            width: 100% !important;
            height: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
        }

        body {
            font-family: 'SVN-Gilroy', 'SVN-Gilroy Bold', sans-serif;
            margin: 0 !important;
            padding: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            overflow: hidden !important;
            background-color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .scoreboards-wrapper {
            position: relative;
            width: 96vw;
            max-width: 1280px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .scoreboard-card {
            position: relative;
            border-radius: 16px;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 180px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.25);
            transition: transform 0.25s ease, box-shadow 0.25s ease, opacity 0.25s ease, border-color 0.25s ease;
        }

        .card-p1 {
            background-color: #f02828 !important;
            border: 3px solid #ff4d4d;
        }

        .card-p2 {
            background-color: #f2a900 !important;
            border: 3px solid #fbbf24;
        }

        .card-p3 {
            background-color: #1d64f2 !important;
            border: 3px solid #60a5fa;
        }

        /* Khi một người chơi bấm chuông nhanh nhất: Thẻ người chơi đó sáng rực rỡ, không nhấp nháy */
        .scoreboard-card.buzzer-winner {
            transform: translateY(-8px) scale(1.05) !important;
            border-color: #ffffff !important;
            border-width: 4px !important;
            z-index: 35 !important;
            animation: none !important;
        }

        .scoreboard-card.card-p1.buzzer-winner {
            background-color: #ff2222 !important;
            box-shadow: 0 0 35px #ffffff, 0 0 70px #ff3b30, 0 20px 45px rgba(0,0,0,0.7) !important;
        }

        .scoreboard-card.card-p2.buzzer-winner {
            background-color: #ffaa00 !important;
            box-shadow: 0 0 35px #ffffff, 0 0 70px #fde047, 0 20px 45px rgba(0,0,0,0.7) !important;
        }

        .scoreboard-card.card-p3.buzzer-winner {
            background-color: #1a62ff !important;
            box-shadow: 0 0 35px #ffffff, 0 0 70px #60a5fa, 0 20px 45px rgba(0,0,0,0.7) !important;
        }

        /* 2 đội còn lại giảm nhẹ độ mờ để tôn lên đội bấm chuông */
        .scoreboard-card.buzzer-dimmed {
            opacity: 0.45 !important;
            transform: scale(0.97) !important;
            filter: grayscale(25%);
        }

        .team-title {
            color: rgba(255, 255, 255, 0.95);
            font-weight: 900;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-size: 60px;
            margin-bottom: 8px;
            text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000;
        }

        .number-text {
            color: #ffffff;
            font-size: clamp(36px, 6vw, 76px);
            font-weight: 900;
            line-height: 1;
            letter-spacing: -0.02em;
            text-shadow: 
                -3px -3px 0 #000,  
                 3px -3px 0 #000,
                -3px  3px 0 #000,
                 3px  3px 0 #000,
                 0px -3px 0 #000,
                 0px  3px 0 #000,
                -3px  0px 0 #000,
                 3px  0px 0 #000;
            text-align: center;
            white-space: nowrap;
        }

        /* Ký hiệu bấm chuông dạng mũi tên đôi trên scoreboard (không nhấp nháy) */
        .buzzer-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
            z-index: 40;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .buzzer-arrow.left { left: 10px; }
        .buzzer-arrow.right { right: 10px; }

        .buzzer-arrow.active {
            opacity: 1 !important;
            visibility: visible !important;
            animation: none !important;
        }

        .buzzer-svg {
            width: clamp(48px, 6.5vw, 76px);
            height: auto;
            filter: drop-shadow(0 0 10px #ffffff) drop-shadow(0 0 22px rgba(255,255,255,0.95));
            pointer-events: none;
            user-select: none;
        }

        .buzzer-symbol-img {
            display: none;
        }
    </style>
</head>
<body class="w-screen h-screen overflow-hidden">

    <div class="scoreboards-wrapper" id="scoreboardsWrapper">
        <!-- ĐỘI ĐỎ -->
        <div class="scoreboard-card card-p1" id="cardP1">
            <div id="buzzerL1" class="buzzer-arrow left">
                <svg viewBox="0 0 60 44" class="buzzer-svg" xmlns="http://www.w3.org/2000/svg">
                    <polygon points="12,4 12,40 52,22" fill="#ffffff" />
                </svg>
            </div>
            <div id="buzzerR1" class="buzzer-arrow right">
                <svg viewBox="0 0 60 44" class="buzzer-svg" xmlns="http://www.w3.org/2000/svg">
                    <polygon points="48,4 48,40 8,22" fill="#ffffff" />
                </svg>
            </div>
            <div class="team-title" id="nameP1">ĐỘI ĐỎ</div>
            <div class="number-text" id="scoreP1">0</div>
        </div>

        <!-- ĐỘI VÀNG -->
        <div class="scoreboard-card card-p2" id="cardP2">
            <div id="buzzerL2" class="buzzer-arrow left">
                <svg viewBox="0 0 60 44" class="buzzer-svg" xmlns="http://www.w3.org/2000/svg">
                    <polygon points="12,4 12,40 52,22" fill="#ffffff" />
                </svg>
            </div>
            <div id="buzzerR2" class="buzzer-arrow right">
                <svg viewBox="0 0 60 44" class="buzzer-svg" xmlns="http://www.w3.org/2000/svg">
                    <polygon points="48,4 48,40 8,22" fill="#ffffff" />
                </svg>
            </div>
            <div class="team-title" id="nameP2">ĐỘI VÀNG</div>
            <div class="number-text" id="scoreP2">0</div>
        </div>

        <!-- ĐỘI LAM -->
        <div class="scoreboard-card card-p3" id="cardP3">
            <div id="buzzerL3" class="buzzer-arrow left">
                <svg viewBox="0 0 60 44" class="buzzer-svg" xmlns="http://www.w3.org/2000/svg">
                    <polygon points="12,4 12,40 52,22" fill="#ffffff" />
                </svg>
            </div>
            <div id="buzzerR3" class="buzzer-arrow right">
                <svg viewBox="0 0 60 44" class="buzzer-svg" xmlns="http://www.w3.org/2000/svg">
                    <polygon points="48,4 48,40 8,22" fill="#ffffff" />
                </svg>
            </div>
            <div class="team-title" id="nameP3">ĐỘI LAM</div>
            <div class="number-text" id="scoreP3">0</div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let roomId = urlParams.get('roomid') || localStorage.getItem('crossword_control_roomid') || localStorage.getItem('crossword_player_roomid') || '123456';
        const singleP = urlParams.get('p');

        // Nếu chỉ định ?p=1 hoặc 2 hoặc 3, chuyển hướng hoặc chỉ hiển thị đội đó
        if (singleP === '1') {
            window.location.replace(`scoreboard1.html?roomid=${encodeURIComponent(roomId)}`);
        } else if (singleP === '2') {
            window.location.replace(`scoreboard2.html?roomid=${encodeURIComponent(roomId)}`);
        } else if (singleP === '3') {
            window.location.replace(`scoreboard3.html?roomid=${encodeURIComponent(roomId)}`);
        }

        const scoreP1El = document.getElementById('scoreP1');
        const scoreP2El = document.getElementById('scoreP2');
        const scoreP3El = document.getElementById('scoreP3');
        const nameP1El = document.getElementById('nameP1');
        const nameP2El = document.getElementById('nameP2');
        const nameP3El = document.getElementById('nameP3');

        function formatScore(val) {
            if (val === undefined || val === null || isNaN(val)) return "0";
            return Number(val).toLocaleString('vi-VN');
        }

        let currentScoreboardWinner = null;
        function clearScoreboardBuzzer() {
            currentScoreboardWinner = null;
            for (let i = 1; i <= 3; i++) {
                const card = document.getElementById(`cardP${i}`);
                const lEl = document.getElementById(`buzzerL${i}`);
                const rEl = document.getElementById(`buzzerR${i}`);
                if (card) {
                    card.classList.remove('buzzer-winner');
                    card.classList.remove('buzzer-dimmed');
                }
                if (lEl) lEl.classList.remove('active');
                if (rEl) rEl.classList.remove('active');
            }
        }

        function triggerBuzzer(playerNum) {
            const p = parseInt(playerNum);
            // Khóa chuông: Chỉ hiện chuông của người bấm nhanh nhất
            if (!p || (currentScoreboardWinner !== null && currentScoreboardWinner !== p)) return;
            currentScoreboardWinner = p;
            for (let i = 1; i <= 3; i++) {
                const isWinner = (i === p);
                const card = document.getElementById(`cardP${i}`);
                const lEl = document.getElementById(`buzzerL${i}`);
                const rEl = document.getElementById(`buzzerR${i}`);
                if (card) {
                    if (isWinner) {
                        card.classList.add('buzzer-winner');
                        card.classList.remove('buzzer-dimmed');
                    } else {
                        card.classList.remove('buzzer-winner');
                        card.classList.add('buzzer-dimmed');
                    }
                }
                if (lEl) lEl.classList.toggle('active', isWinner);
                if (rEl) rEl.classList.toggle('active', isWinner);
            }
            try {
                const audio = new Audio("ding.wav");
                audio.play().catch(() => {
                    const fallback = new Audio("ding.mp3");
                    fallback.play().catch(() => {});
                });
            } catch(e) {}
        }

        function handleCommand(msg) {
            if (!msg) return;
            const type = msg.type || msg.action;
            const data = msg.data || msg.payload?.data;

            if (type === 'UPDATE_SCOREBOARD' || type === 'UPDATE_SCORE') {
                const scoreData = data || msg.payload;
                const showTotal = !!(scoreData && scoreData.showTotal);
                if (scoreData) {
                    if (scoreData.p1) {
                        if (scoreData.p1.name) nameP1El.textContent = scoreData.p1.name.toUpperCase();
                        const val1 = showTotal ? (Number(scoreData.p1.total) || 0) : (Number(scoreData.p1.score) || 0);
                        scoreP1El.textContent = formatScore(val1);
                    }
                    if (scoreData.p2) {
                        if (scoreData.p2.name) nameP2El.textContent = scoreData.p2.name.toUpperCase();
                        const val2 = showTotal ? (Number(scoreData.p2.total) || 0) : (Number(scoreData.p2.score) || 0);
                        scoreP2El.textContent = formatScore(val2);
                    }
                    if (scoreData.p3) {
                        if (scoreData.p3.name) nameP3El.textContent = scoreData.p3.name.toUpperCase();
                        const val3 = showTotal ? (Number(scoreData.p3.total) || 0) : (Number(scoreData.p3.score) || 0);
                        scoreP3El.textContent = formatScore(val3);
                    }
                }
            }

            if (type === 'CLEAR_BUZZER' || type === 'RESET_BUZZ' || type === 'START_TOSSUP' || type === 'START_ROUND30' || (type === 'SET_BUZZER_STATE' && data && data.state === 'OPEN')) {
                clearScoreboardBuzzer();
            }

            if (msg.event === 'player-buzz' || type === 'PLAYER_BUZZ_WIN' || type === 'PLAYER_BUZZ' || type === 'BELL' || type === 'BUZZER' || msg.latestWinner) {
                const pNum = msg.latestWinner || msg.payload?.playerNum || msg.data?.playerNum || data?.playerNum || msg.playerNum;
                if (pNum) triggerBuzzer(pNum);
            }
        }

        // 1. LocalStorage & High Frequency Polling
        function loadInitial() {
            try {
                const raw = localStorage.getItem('control-to-display-msg_' + roomId) || localStorage.getItem('control-to-display-msg');
                if (raw) handleCommand(JSON.parse(raw));
                const initWinner = localStorage.getItem('tossup-buzzer-winner_' + roomId) || localStorage.getItem('tossup-buzzer-winner');
                if (initWinner) triggerBuzzer(initWinner);
            } catch(e) {}
        }
        loadInitial();

        window.addEventListener('storage', (e) => {
            if (!e.key) return;
            if ((e.key === 'control-to-display-msg' || e.key === 'control-to-display-msg_' + roomId) && e.newValue) {
                try { handleCommand(JSON.parse(e.newValue)); } catch(err) {}
            }
            if ((e.key === 'player-buzz-msg' || e.key === 'player-buzz-msg_' + roomId) && e.newValue) {
                try {
                    const parsed = JSON.parse(e.newValue);
                    const pNum = parsed?.payload?.playerNum || parsed?.playerNum;
                    if (pNum) triggerBuzzer(pNum);
                } catch(err) {}
            }
            if (e.key === 'tossup-buzzer-winner' || e.key === 'tossup-buzzer-winner_' + roomId) {
                if (e.newValue) {
                    triggerBuzzer(e.newValue);
                } else {
                    clearScoreboardBuzzer();
                }
            }
            if ((e.key === 'tossup-buzzer-open' || e.key === 'tossup-buzzer-open_' + roomId) && e.newValue === '1') {
                clearScoreboardBuzzer();
            }
        });

        // 80ms Polling fallback for instant synchronization across tabs
        setInterval(() => {
            try {
                const winner = localStorage.getItem('tossup-buzzer-winner_' + roomId) || localStorage.getItem('tossup-buzzer-winner');
                if (winner) {
                    const wNum = parseInt(winner);
                    if (wNum && currentScoreboardWinner !== wNum) {
                        triggerBuzzer(wNum);
                    }
                } else if (currentScoreboardWinner !== null) {
                    const isOpen = localStorage.getItem('tossup-buzzer-open_' + roomId) === '1' || localStorage.getItem('tossup-buzzer-open') === '1';
                    if (isOpen || !winner) {
                        clearScoreboardBuzzer();
                    }
                }
            } catch(e) {}
        }, 80);

        // 2. BroadcastChannel (All room variants)
        try {
            if (typeof BroadcastChannel !== 'undefined') {
                const channels = [
                    'crossword_broadcast_room_' + roomId,
                    'crossword_broadcast_room_123456',
                    'crossword_broadcast_room',
                    'broadcast_channel_' + roomId
                ];
                channels.forEach(name => {
                    try {
                        const bc = new BroadcastChannel(name);
                        bc.onmessage = (e) => {
                            if (!e.data) return;
                            const d = e.data;
                            if (d.event === 'player-buzz' || d.type === 'PLAYER_BUZZ_WIN' || d.type === 'PLAYER_BUZZ') {
                                const p = d.payload?.playerNum || d.data?.playerNum || d.playerNum;
                                if (p) triggerBuzzer(p);
                            } else {
                                handleCommand(d.payload || d);
                            }
                        };
                    } catch(err) {}
                });
            }
        } catch(e) {}

        // 3. Socket.IO Transport
        if (typeof io !== 'undefined') {
            try {
                const socket = io({
                    transports: ['websocket', 'polling'],
                    query: { roomid: roomId }
                });
                socket.emit('join-room', roomId);
                socket.emit('join-room', '123456');
                socket.emit('join-room', 'default');
                socket.on('player-buzz', (data) => {
                    const pNum = data?.payload?.playerNum || data?.playerNum || data?.latestWinner;
                    if (pNum) triggerBuzzer(pNum);
                });
                socket.on('buzzer-state-update', (data) => {
                    if (data?.latestWinner) triggerBuzzer(data.latestWinner);
                    else if (data?.isOpen) clearScoreboardBuzzer();
                });
                socket.on('control-command', (data) => {
                    if (data) handleCommand(data.payload || data);
                });
                socket.on('control-to-display', (data) => {
                    if (data) handleCommand(data.payload || data);
                });
                socket.on('broadcast', (data) => {
                    if (data) handleCommand(data.payload || data);
                });
            } catch(e) {}
        }

        // 4. SSE Connection (/api/events)
        function connectScoreboardSSE() {
            if (typeof EventSource === "undefined") return;
            try {
                const sse = new EventSource(`/api/events?roomid=${encodeURIComponent(roomId)}&role=0`);
                sse.onmessage = (e) => {
                    try {
                        const msg = JSON.parse(e.data);
                        if (!msg) return;
                        if (msg.event === 'player-buzz' && (msg.payload?.playerNum || msg.playerNum)) {
                            triggerBuzzer(msg.payload?.playerNum || msg.playerNum);
                        } else if (msg.event === 'buzzer-state-update') {
                            if (msg.latestWinner) {
                                triggerBuzzer(msg.latestWinner);
                            } else if (msg.isOpen) {
                                clearScoreboardBuzzer();
                            }
                        } else if (msg.payload) {
                            handleCommand(msg.payload);
                        } else {
                            handleCommand(msg);
                        }
                    } catch(err){}
                };
                sse.onerror = () => {
                    try { sse.close(); } catch(e){}
                    setTimeout(connectScoreboardSSE, 2500);
                };
            } catch(e) {}
        }
        connectScoreboardSSE();

        // 5. MultiSyncBridge
        if (window.GameSync) {
            window.GameSync.init({
                role: 'scoreboard',
                roomId: roomId,
                onMessage: (msg) => {
                    if (msg.event === 'control-to-display' && msg.payload) {
                        handleCommand(msg.payload);
                    } else if (msg.event === 'player-buzz' && (msg.payload?.playerNum || msg.playerNum)) {
                        triggerBuzzer(msg.payload?.playerNum || msg.playerNum);
                    } else {
                        handleCommand(msg);
                    }
                }
            });
        }

        // 6. Server Room State Query
        fetch(`/api/get-room-state?roomid=${encodeURIComponent(roomId)}`)
            .then(r => r.json())
            .then(data => {
                if (data && data.latestWinner) {
                    triggerBuzzer(data.latestWinner);
                }
            }).catch(() => {});

        // 7. Testing shortcuts (Press 1, 2, 3 or Space)
        window.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            if (e.key === '1') triggerBuzzer(1);
            else if (e.key === '2') triggerBuzzer(2);
            else if (e.key === '3') triggerBuzzer(3);
            else if (e.key === 'Escape' || e.key === 'c' || e.key === 'C') clearScoreboardBuzzer();
            else if (e.code === 'Space' || e.key === 'b' || e.key === 'B') {
                e.preventDefault();
                triggerBuzzer(1);
            }
    </script>
</body>
</html>
